<section class="sec seguro" id="cuidado">
  <div class="wrap seguro-in">
    <div>
      <div class="sec-head" style="margin-bottom:26px">
        <span class="kicker">Tu seguridad primero</span>
        <h2 class="h-display">{{titulo}}</h2>
        <p>{{intro}}</p>
      </div>
      <div class="cuidado-grid">
        <div class="cuidado"><i>🔥</i><b>Calentamiento obligatorio</b><span>{{calentar}}</span></div>
        <div class="cuidado"><i>🪜</i><b>Progresión por etapas</b><span>{{etapas}}</span></div>
        <div class="cuidado"><i>🤝</i><b>{{coach_t}}</b><span>{{coach}}</span></div>
        <div class="cuidado"><i>🟦</i><b>Colchonetas y equipos</b><span>{{equipo}}</span></div>
      </div>
      <p class="cuidado-nota">🩹 {{lesion}}</p>
    </div>
    <div class="seguro-pics">
      <img class="alto" src="{{foto1}}" alt="{{alt1}}" loading="lazy" />
      <img class="bajo" src="{{foto2}}" alt="{{alt2}}" loading="lazy" />
      <img class="bajo" src="{{foto3}}" alt="{{alt3}}" loading="lazy" />
    </div>
  </div>
</section>
